name: Accessibility performance comparison

on:
  workflow_call:
    inputs:
      release_artifact:
        description: Same-run default-feature release artifact from the required Full verification job
        type: string
        required: true

permissions:
  contents: read

jobs:
  settings-performance:
    name: Same-source accessibility cost
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the verified default-feature release from this run
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_artifact }}
          path: target/perf-artifacts/default
      - name: Validate release provenance and checksums
        id: artifact
        env:
          RELEASE_ARTIFACT: ${{ inputs.release_artifact }}
        run: |
          New-Item -ItemType Directory -Force -Path target/qa/perf | Out-Null
          $validation = [ordered]@{ status = 'running'; artifact = $env:RELEASE_ARTIFACT; expectedRevision = $env:GITHUB_SHA; files = @() }
          try {
            $revision = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA) { throw 'Checkout revision differs from the workflow revision.' }
            $metadata = Get-Content -LiteralPath target/perf-artifacts/default/build.json -Raw | ConvertFrom-Json
            $validation['build'] = $metadata
            if ($metadata.revision -cne $revision -or [string]$metadata.runId -cne $env:GITHUB_RUN_ID) { throw 'Release must come from this revision and workflow run.' }
            if ($metadata.verification -cne 'scripts/verify.ps1 -Mode Full' -or $metadata.target -cne 'x86_64-pc-windows-msvc') { throw 'Release verification or target is not the expected configuration.' }
            if ($metadata.profile -cne 'release' -or $metadata.features -cne 'default' -or [string]::IsNullOrWhiteSpace($metadata.rustcVersion)) { throw 'Release compiler, profile and default-feature provenance are required.' }
            $checksums = @{}
            foreach ($line in Get-Content -LiteralPath target/perf-artifacts/default/SHA256SUMS.txt) {
              if ($line -cnotmatch '^([0-9a-fA-F]{64}) \*(openhinovoice\.exe|overlay_preview\.exe)$') { throw 'Malformed checksum manifest.' }
              $name = $Matches[2]
              if ($checksums.ContainsKey($name)) { throw "Duplicate checksum: $name" }
              $checksums[$name] = $Matches[1].ToLowerInvariant()
            }
            if ($checksums.Count -ne 2) { throw 'Expected both verified release binaries.' }
            foreach ($name in @('openhinovoice.exe', 'overlay_preview.exe')) {
              $path = Join-Path target/perf-artifacts/default $name
              $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -cne $checksums[$name]) { throw "Checksum mismatch: $name" }
              $validation.files += [ordered]@{ file = $name; sha256 = $actual; bytes = (Get-Item -LiteralPath $path).Length }
            }
            $validation.status = 'passed'
          } catch {
            $validation.status = 'failed'; $validation['error'] = $_.Exception.Message
            throw
          } finally {
            $validation | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath target/qa/perf/artifact-validation.json -Encoding utf8NoBOM
          }
      - name: Compile the isolated measurement helper on the runner
        id: harness
        run: ./scripts/measure-ui.ps1 -CompileOnly -OutputDir target/qa/perf/compile
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: windows-perf-feature-off
          workspaces: . -> target/perf-feature-off
          cache-on-failure: true
      - name: Prepare identical compiler and locked dependencies
        id: dependencies
        run: |
          $metadata = Get-Content -LiteralPath target/perf-artifacts/default/build.json -Raw | ConvertFrom-Json
          $rustcVersion = (rustc -Vv | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustcVersion | Set-Content -LiteralPath target/qa/perf/rustc.log -Encoding utf8NoBOM
          if ($rustcVersion -cne $metadata.rustcVersion) { throw 'The baseline compiler differs from the verified candidate compiler.' }
          cargo fetch --locked 2>&1 | Tee-Object -FilePath target/qa/perf/fetch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --no-deps --format-version 1 --locked --offline | Set-Content -LiteralPath target/qa/perf/cargo-metadata.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargoMetadata = Get-Content -LiteralPath target/qa/perf/cargo-metadata.json -Raw | ConvertFrom-Json
          $packages = @($cargoMetadata.packages | Where-Object name -eq 'openhinovoice')
          if ($packages.Count -ne 1 -or @($packages[0].features.default).Count -ne 1 -or $packages[0].features.default[0] -cne 'accessibility') {
            throw 'The default build must differ from --no-default-features only by accessibility.'
          }
      - name: Build the same-source feature-off release in a separate target directory
        id: build
        run: |
          cargo build --release --no-default-features --bin openhinovoice --locked --offline --target-dir target/perf-feature-off 2>&1 | Tee-Object -FilePath target/qa/perf/feature-off-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = 'target/perf-feature-off/release/openhinovoice.exe'
          [ordered]@{
            revision = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID
            profile = 'release'; features = '--no-default-features'; target = 'x86_64-pc-windows-msvc'
            rustcVersion = (Get-Content -LiteralPath target/qa/perf/rustc.log -Raw).Trim()
            sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            bytes = (Get-Item -LiteralPath $path).Length
          } | ConvertTo-Json | Set-Content -LiteralPath target/qa/perf/feature-off-build.json -Encoding utf8NoBOM
      - name: Compare settings before and after UIA activation
        id: settings
        run: |
          $parameters = @{
            Mode = 'Settings'
            BaselineExecutable = Join-Path $env:GITHUB_WORKSPACE 'target/perf-feature-off/release/openhinovoice.exe'
            CandidateExecutable = Join-Path $env:GITHUB_WORKSPACE 'target/perf-artifacts/default/openhinovoice.exe'
            BaselineRevision = $env:GITHUB_SHA; CandidateRevision = $env:GITHUB_SHA
            BaselineFeatures = '--no-default-features'; CandidateFeatures = 'default (accessibility)'
            BaselineUia = 'Absent'; CandidateUia = 'Present'
            Repetitions = 3; DurationSeconds = 30; IntervalMs = 1000; WarmupMs = 2000
            OutputDir = 'target/qa/perf/settings'
          }
          & ./scripts/measure-ui.ps1 @parameters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $measurement = Get-Content -LiteralPath target/qa/perf/settings/result.json -Raw | ConvertFrom-Json
          if ($measurement.status -ne 'measured' -or $measurement.measurement -ne 'measured') { throw 'Settings measurements did not complete.' }
      - name: Evaluate the existing accessibility cost budgets
        id: budgets
        run: |
          $measurement = Get-Content -LiteralPath target/qa/perf/settings/result.json -Raw | ConvertFrom-Json
          $budget = $measurement.proposedBudget
          $result = [ordered]@{ status = 'failed'; privateIncreaseBytes = 4MB; executableIncreaseBytes = 1MB; observedDifference = $measurement.difference }
          try {
            if ($measurement.status -ne 'measured' -or $budget.privateIncreaseBytes -ne 4MB -or $budget.executableIncreaseBytes -ne 1MB) { throw 'Complete measurements with the existing budgets are required.' }
            if ($budget.privateExceeded -isnot [bool] -or $budget.executableExceeded -isnot [bool]) { throw 'Budget evaluation is missing.' }
            if ($budget.privateExceeded -or $budget.executableExceeded) { throw 'Measured accessibility cost exceeds the existing budget.' }
            $result.status = 'passed'
          } catch {
            $result['error'] = $_.Exception.Message
            throw
          } finally {
            $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath target/qa/perf/budget-result.json -Encoding utf8NoBOM
          }
      - name: Record completed, failed and unrun work
        if: always()
        env:
          RELEASE_ARTIFACT: ${{ inputs.release_artifact }}
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          CACHE_RESULT: ${{ steps.cache.outcome }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
          HARNESS_RESULT: ${{ steps.harness.outcome }}
          TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          SETTINGS_RESULT: ${{ steps.settings.outcome }}
          BUDGET_RESULT: ${{ steps.budgets.outcome }}
        run: |
          New-Item -ItemType Directory -Force -Path target/qa/perf | Out-Null
          function Outcome([string]$Value) {
            switch ($Value) { 'success' { 'passed' } 'failure' { 'failed' } 'cancelled' { 'failed' } default { 'not_run' } }
          }
          $phases = [ordered]@{
            checkout = Outcome $env:CHECKOUT_RESULT; cache = Outcome $env:CACHE_RESULT
            artifactDownload = Outcome $env:DOWNLOAD_RESULT; artifactValidation = Outcome $env:ARTIFACT_RESULT
            harnessCompilation = Outcome $env:HARNESS_RESULT; toolchain = Outcome $env:TOOLCHAIN_RESULT
            dependencies = Outcome $env:DEPENDENCIES_RESULT; featureOffBuild = Outcome $env:BUILD_RESULT
            settingsMeasurement = Outcome $env:SETTINGS_RESULT; budgetEvaluation = Outcome $env:BUDGET_RESULT
          }
          $status = if ($phases.Values -contains 'failed') { 'failed' } elseif ($phases.Values -contains 'not_run') { 'not_run' } else { 'passed' }
          [ordered]@{
            status = $status; revision = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; releaseArtifact = $env:RELEASE_ARTIFACT
            phases = $phases; repetitions = 3; durationSeconds = 30
            baselineFeatures = '--no-default-features'; candidateFeatures = 'default (accessibility)'
            residentMeasurement = 'not_run'; residentReason = 'An inactive desktop has no guaranteed Explorer tray; this workflow measures settings UIA cost only.'
            liveMicrophoneAndModelTests = 'not_run'
            limitations = @('Hosted desktop/OpenGL/UIA availability is not guaranteed; unavailable observations fail.', 'Expected feature-off UIA absence is not accessibility success.', 'Measurement completion and performance budget acceptance are separate results.', 'Inactive desktop metrics do not establish active HUD, ASR or end-to-end input latency.')
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath target/qa/perf/status.json -Encoding utf8NoBOM
          "Settings UIA measurement: $($phases.settingsMeasurement); budgets: $($phases.budgetEvaluation); resident: not_run." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Keep measurement evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-performance-${{ github.sha }}
          path: |
            target/qa/perf/**/*.json
            target/qa/perf/**/*.log
          if-no-files-found: error
          retention-days: 14
