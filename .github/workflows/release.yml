name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verification
    if: ${{ !cancelled() && needs.verification.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the binaries verified in this run
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-release-${{ github.sha }}
          path: target/verified-release
      - name: Validate the tag and the verified artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $artifact = 'target/verified-release'
          $build = Get-Content -LiteralPath "$artifact/build.json" -Raw | ConvertFrom-Json
          $verification = Get-Content -LiteralPath "$artifact/verification.json" -Raw | ConvertFrom-Json
          if ($build.revision -cne $env:GITHUB_SHA -or [string]$build.runId -cne $env:GITHUB_RUN_ID) {
            throw '成果物のコミットまたはActions実行が一致しません。'
          }
          if ($build.profile -cne 'release' -or $build.features -cne 'default' -or $build.target -cne 'x86_64-pc-windows-msvc') {
            throw '公開するビルド条件が一致しません。'
          }
          if ($build.coreClipboardVerified -isnot [bool] -or -not $build.coreClipboardVerified -or $build.coreTextInsertionVerified -isnot [bool] -or -not $build.coreTextInsertionVerified) {
            throw 'クリップボードと実入力先本文の必須検証が成功していません。'
          }
          if ($verification.revision -cne $env:GITHUB_SHA -or $verification.status -cne 'passed' -or $verification.scope -cne 'full' -or $verification.tests.passed -le 0 -or $verification.tests.failed -ne 0 -or $verification.sourceSha256 -cne $build.sourceSha256) {
            throw 'この成果物のFull検証を確認できません。'
          }
          if ($env:RELEASE_TAG -cne "v$($build.version)") {
            throw 'タグと検証済みパッケージの版が一致しません。'
          }
          $info = (Get-Item -LiteralPath "$artifact/openhinovoice.exe").VersionInfo
          if ($info.FileVersion -cne $build.version -or $info.ProductVersion -cne $build.version -or $info.ProductName -cne 'OpenHinoVoice') {
            throw 'exeの版または製品名が一致しません。'
          }
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath "$artifact/SHA256SUMS.txt") {
            if ($line -cnotmatch '^([0-9a-fA-F]{64}) \*(openhinovoice\.exe|overlay_preview\.exe)$') { throw '成果物のチェックサム形式が不正です。' }
            $name = $Matches[2]
            if ($checksums.ContainsKey($name)) { throw "チェックサムが重複しています: $name" }
            $checksums[$name] = $Matches[1].ToLowerInvariant()
          }
          if ($checksums.Count -ne 2) { throw '検証済みexeのチェックサムが不足しています。' }
          foreach ($name in @('openhinovoice.exe', 'overlay_preview.exe')) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $artifact $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $checksums[$name]) { throw "成果物のハッシュが一致しません: $name" }
          }
          $notes = Join-Path 'docs/releases' "$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'この版のリリースノートがありません。' }
          New-Item -ItemType Directory -Force -Path target/publish | Out-Null
          Copy-Item -LiteralPath "$artifact/openhinovoice.exe", "$artifact/build.json", "$artifact/verification.json", LICENSE, THIRD_PARTY_LICENSES.txt -Destination target/publish
          $publishedChecksums = foreach ($name in @('openhinovoice.exe', 'LICENSE', 'THIRD_PARTY_LICENSES.txt', 'build.json', 'verification.json')) {
            $hash = (Get-FileHash -LiteralPath (Join-Path target/publish $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $publishedChecksums | Set-Content -LiteralPath target/publish/SHA256SUMS.txt -Encoding ascii
      - name: Publish the verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: "1"
        run: |
          $remoteRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '公開先のタグを取得できません。' }
          $object = $remoteRef.object
          while ($object.type -ceq 'tag') {
            $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw '注釈付きタグのコミットを取得できません。' }
            $object = $tag.object
          }
          if ($object.type -cne 'commit' -or $object.sha -cne $env:GITHUB_SHA) { throw 'タグが検証したコミットから変更されています。' }
          $notes = Join-Path 'docs/releases' "$env:GITHUB_REF_NAME.md"
          gh release create "$env:GITHUB_REF_NAME" target/publish/openhinovoice.exe target/publish/LICENSE target/publish/THIRD_PARTY_LICENSES.txt target/publish/SHA256SUMS.txt target/publish/build.json target/publish/verification.json --repo "$env:GITHUB_REPOSITORY" --verify-tag --target "$env:GITHUB_SHA" --latest --title "OpenHinoVoice $env:GITHUB_REF_NAME" --notes-file "$notes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
