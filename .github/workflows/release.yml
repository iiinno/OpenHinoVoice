name: Release

# v で始まるタグを push すると、ビルド済みの exe を GitHub Releases に置く
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Cargo build scripts must never inherit a write-capable Git checkout token.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify that the tag matches Cargo.toml
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'openhinovoice' }
          if (@($package).Count -ne 1) { throw 'Could not identify the openhinovoice package' }
          if ($env:RELEASE_TAG -cne "v$($package.version)") {
            throw "Release tag $env:RELEASE_TAG does not match Cargo version $($package.version)"
          }
      - name: Prepare locked dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/qa/ci | Out-Null
          cargo fetch --locked 2>&1 | Tee-Object -FilePath target/qa/ci/fetch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the real Windows clipboard contract
        timeout-minutes: 10
        shell: pwsh
        run: |
          cargo test --lib paste::tests::clipboard_write_tracks_the_published_sequence --locked --offline -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath target/qa/ci/clipboard-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content target/qa/ci/clipboard-contract.log -Raw) -notmatch 'test result: ok\. 1 passed; 0 failed') { throw 'The required clipboard regression did not run.' }
      - name: Verify recording through actual text insertion
        timeout-minutes: 10
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:GITHUB_WORKSPACE 'target/qa/core-e2e'
          $env:APPDATA = Join-Path $sandbox 'appdata'
          $env:LOCALAPPDATA = Join-Path $sandbox 'localappdata'
          $env:OHV_TEST_NAMESPACE = "core-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          cargo test --lib app::core_e2e::record_enter_pastes_once_and_restores_clipboard --locked --offline -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath target/qa/ci/core-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content target/qa/ci/core-e2e.log -Raw) -notmatch 'test result: ok\. 1 passed; 0 failed') { throw 'The required end-to-end insertion regression did not run.' }
      - name: Verify in isolated application directories
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode Full -OutputDir target/qa/ci
      - name: Validate EXE version and create checksum
        shell: pwsh
        run: |
          $package = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'openhinovoice' }
          $version = $package.version
          $info = (Get-Item 'target/release/openhinovoice.exe').VersionInfo
          $numericVersion = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart)"
          $expectedNumericVersion = ($version -split '[-+]')[0]
          if ($numericVersion -cne $expectedNumericVersion) {
            throw "EXE numeric version $numericVersion does not match Cargo version $version"
          }
          if ($info.FileVersion -cne $version -or $info.ProductVersion -cne $version) {
            throw "EXE string versions $($info.FileVersion), $($info.ProductVersion) do not match $version"
          }
          if ($info.ProductName -cne 'OpenHinoVoice') {
            throw "Unexpected EXE ProductName: $($info.ProductName)"
          }
          $hash = (Get-FileHash 'target/release/openhinovoice.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  openhinovoice.exe" | Set-Content -NoNewline -Encoding ascii SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # gh release create fails if a release already exists. Never upload --clobber.
          gh release create "$env:GITHUB_REF_NAME" target/release/openhinovoice.exe LICENSE THIRD_PARTY_LICENSES.txt SHA256SUMS.txt --verify-tag --title "OpenHinoVoice $env:GITHUB_REF_NAME" --notes "Windows x64 用のビルド済み exe（コード署名なし）です。導入の手順は README を参照してください。LICENSE と THIRD_PARTY_LICENSES.txt を同梱しています。SHA256SUMS.txt で exe の SHA-256 を検証できます。"
      - name: Keep release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: |
            target/qa/ci/*.json
            target/qa/ci/*.log
          if-no-files-found: error
          retention-days: 14
